name: Language Reference Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - docs/**
      - scripts/**
      - .github/workflows/reference.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - scripts/**
      - .github/workflows/reference.yml
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: reference-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TSUZURI_CLANG: /usr/lib/llvm-21/bin/clang
      TSUZURI_WASM_LD: /usr/lib/llvm-21/bin/wasm-ld
      TSUZURI_REPO: ${{ github.workspace }}/.tsuzuri-src
      TSUZURI_BIN: ${{ github.workspace }}/.tsuzuri-src/target/debug/tsuzuri
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine pages to verify
        id: pages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          list=""
          skip=false
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git diff --quiet "$BASE" HEAD -- scripts/; then
              list=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'README.md' 'docs/*.md' 'docs/**/*.md' | tr '\n' ' ')
              if [ -z "$list" ]; then skip=true; fi
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then echo "no page changed: nothing to check"; else echo "pages: ${list:-all}"; fi
      - name: Checkout Tsuzuri compiler repository
        if: steps.pages.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: tatsuya-midorikawa/Tsuzuri
          path: .tsuzuri-src
      - uses: actions/setup-node@v7
        if: steps.pages.outputs.skip != 'true'
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pages.outputs.skip != 'true'
      - uses: actions/cache@v4
        if: steps.pages.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tsuzuri-src/Cargo.lock') }}
          restore-keys: reference-${{ runner.os }}-${{ runner.arch }}-
      - name: Install LLVM 21 on Linux
        if: steps.pages.outputs.skip != 'true'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo -n tee /usr/share/keyrings/llvm.gpg >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main\n' | sudo -n tee /etc/apt/sources.list.d/llvm21.list >/dev/null
          sudo -n apt-get update
          sudo -n apt-get install -y clang-21 lld-21 llvm-21
      - name: Build Tsuzuri compiler (dev profile)
        if: steps.pages.outputs.skip != 'true'
        working-directory: .tsuzuri-src
        run: cargo build --locked
      - name: Check CLI / Diagnostic / Stdlib coverage and generated blocks
        if: steps.pages.outputs.skip != 'true' && steps.pages.outputs.list == ''
        run: |
          node scripts/gen-docs.mjs --check
          node scripts/check-cli-docs.mjs
      - name: Verify links, anchors, and code examples
        if: steps.pages.outputs.skip != 'true'
        env:
          PAGES: ${{ steps.pages.outputs.list }}
        run: node scripts/check-docs.mjs $PAGES
